services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      retries: 5
      timeout: 3s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  users_service:
    build:
      context: ./backend/users
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    container_name: users_service
    restart: on-failure
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8001:8001"

  posts_service:
    build:
      context: ./backend/posts
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      users_service:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
    container_name: posts_service
    restart: on-failure
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8002:8002"
    entrypoint: ["/bin/sh", "-c", "sleep 10 && uvicorn main:app --host 0.0.0.0 --port 8002"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env  # Cargar variables de entorno en el frontend
    depends_on:
      - users_service
      - posts_service
    container_name: react_frontend
    ports:
      - "3000:80" # Servir en el puerto 3000 usando Nginx
    restart: on-failure


volumes:
  postgres_data:
